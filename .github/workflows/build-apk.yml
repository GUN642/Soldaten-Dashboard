name: APK bauen

"on":
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Projekt auschecken
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Festen Signierschluessel einrichten
        run: |
          if [ ! -f keystore/debug.keystore ]; then
            echo "FEHLER: keystore/debug.keystore fehlt im Projekt."
            echo "Ohne diese Datei erhaelt jeder Build eine neue Signatur und"
            echo "Updates lassen sich nicht ueber die vorhandene App installieren."
            exit 1
          fi
          mkdir -p ~/.android
          cp keystore/debug.keystore ~/.android/debug.keystore
          echo "Signatur, die dieser Build verwendet:"
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android \
            | grep -E "SHA256:" | head -1

      - name: Abhaengigkeiten installieren
        run: npm install

      - name: Android-Projekt erzeugen
        run: npx cap add android

      - name: Kalenderberechtigungen eintragen
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if [ ! -f "$MANIFEST" ]; then
            echo "FEHLER: $MANIFEST nicht gefunden."
            exit 1
          fi
          for P in READ_CALENDAR WRITE_CALENDAR POST_NOTIFICATIONS SCHEDULE_EXACT_ALARM USE_EXACT_ALARM RECEIVE_BOOT_COMPLETED VIBRATE READ_CONTACTS INTERNET; do
            if grep -q "android.permission.$P" "$MANIFEST"; then
              echo "bereits vorhanden: $P"
            else
              sed -i "s#</manifest>#    <uses-permission android:name=\"android.permission.$P\" />\n</manifest>#" "$MANIFEST"
              echo "eingetragen: $P"
            fi
          done
          echo "--- AndroidManifest.xml ---"
          cat "$MANIFEST"
          for P in READ_CALENDAR WRITE_CALENDAR POST_NOTIFICATIONS; do
            grep -q "android.permission.$P" "$MANIFEST" || { echo "FEHLER: $P fehlt"; exit 1; }
          done

      - name: Eigenes Kontakt-Plugin einsetzen
        run: |
          ZIEL=android/app/src/main/java/de/gun/dienstcockpit
          if [ ! -d "$ZIEL" ]; then
            echo "FEHLER: $ZIEL nicht gefunden - stimmt die appId in capacitor.config.json?"
            find android/app/src/main/java -type d || true
            exit 1
          fi
          if [ ! -f native/KontaktDatenPlugin.java ]; then
            echo "FEHLER: native/KontaktDatenPlugin.java fehlt im Projekt."
            exit 1
          fi
          cp native/KontaktDatenPlugin.java "$ZIEL/"
          cp native/MainActivity.java "$ZIEL/"
          echo "Eingesetzt:"
          ls -la "$ZIEL"

      - name: App-Icon erzeugen (falls vorhanden)
        run: |
          if [ -f resources/icon.png ]; then
            echo "resources/icon.png gefunden - erzeuge Android-Symbole"
            npx @capacitor/assets generate --android --assetPath resources
          else
            echo "Kein resources/icon.png vorhanden - Standardsymbol wird verwendet"
          fi

      - name: Versionsnummer setzen
        run: |
          GRADLE=android/app/build.gradle
          VNAME=$(node -p "require('./package.json').version")
          VCODE=${GITHUB_RUN_NUMBER:-1}
          echo "versionCode $VCODE / versionName $VNAME"
          sed -i "s/versionCode .*/versionCode $VCODE/" "$GRADLE"
          sed -i "s/versionName .*/versionName \"$VNAME\"/" "$GRADLE"
          grep -E "versionCode|versionName" "$GRADLE"

      - name: Web-Dateien uebernehmen
        run: npx cap sync android

      - name: Gradle ausfuehrbar machen
        run: chmod +x android/gradlew

      - name: APK bauen
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Signatur der fertigen APK pruefen
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          echo "=============================================="
          echo " FINGERABDRUCK DER APK"
          echo " Muss bei JEDEM Build gleich sein. Weicht er ab,"
          echo " laesst sich das Update nicht darueber installieren."
          echo "=============================================="
          keytool -printcert -jarfile "$APK" | grep -E "SHA256:|Inhaber:|Owner:" | head -3
          echo "=============================================="
          echo " Erwartet wird:"
          echo " 42:6E:07:AE:3C:EE:9D:62:DB:D8:12:0D:C9:40:1E:BC:"
          echo " 2C:20:69:D1:9B:F5:6F:77:4F:7F:D2:90:99:4A:69:94"
          echo "=============================================="

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Dienst-Cockpit-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
