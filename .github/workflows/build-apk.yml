name: APK bauen

# Startet bei jedem Push und zusaetzlich von Hand ueber den Reiter "Actions".
# Der automatische Start war frueher abgeschaltet, weil beim Hochladen vieler
# Dateien ueber die GitHub-Oberflaeche mehrere Commits entstanden und der Bau
# auf einem noch unvollstaendigen Stand ansprang. Inzwischen wird in der Regel
# nur noch www/index.html einzeln hochgeladen, damit entfaellt der Grund.
# Aenderungen an reinen Textdateien (README, CLAUDE.md) loesen keinen Bau aus.
"on":
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"

# Laedt man zweimal kurz hintereinander hoch, wird der aeltere Lauf abgebrochen.
# Sonst laufen beide durch und legen nacheinander dasselbe Release an.
concurrency:
  group: apk-bau-${{ github.ref }}
  cancel-in-progress: true

# Noetig, damit dieser Workflow ein GitHub-Release anlegen darf (fuer die
# automatische Update-Pruefung der App). Ohne dies bricht der Release-Schritt
# mit einer Berechtigungsmeldung ab.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Projekt auschecken
        uses: actions/checkout@v4

      - name: Projektpaket entpacken (falls hochgeladen)
        run: python3 scripts/paket-entpacken.py

      - name: Projektdateien pruefen
        run: python3 scripts/projekt-pruefen.py

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Signierschluessel pruefen
        run: |
          if [ ! -f keystore/debug.keystore ]; then
            echo "FEHLER: keystore/debug.keystore fehlt im Projekt."
            echo "Ohne diese Datei erhaelt jeder Build eine neue Signatur und"
            echo "Updates lassen sich nicht ueber die vorhandene App installieren."
            exit 1
          fi
          # Zusaetzlich an den Standardort legen, falls etwas darauf zugreift
          mkdir -p ~/.android
          cp keystore/debug.keystore ~/.android/debug.keystore
          echo "Schluessel im Projekt:"
          keytool -list -v -keystore keystore/debug.keystore -storepass android \
            | grep -E "SHA256:" | head -1

      - name: Abhaengigkeiten installieren
        run: npm install

      - name: Android-Projekt erzeugen
        run: npx cap add android

      - name: Signatur fest in Gradle eintragen
        run: |
          python3 scripts/signatur-eintragen.py
          echo "--- Auszug aus build.gradle ---"
          grep -A10 "dienstcockpit-signatur" android/app/build.gradle
          grep -A3 "buildTypes" android/app/build.gradle

      # Berechtigungen, Sicherungsregeln, Module und Widget werden alle von
      # diesem einen Skript eingetragen. Die Berechtigungen standen frueher
      # als sed-Schleife direkt hier - dadurch erhielt ein lokaler Build eine
      # APK ohne Kalender-, Kontakt- und Benachrichtigungsrechte. Jetzt tun
      # CI und lokaler Build dasselbe.
      - name: Eigene Module, Widget, Berechtigungen und Sicherungsregeln einsetzen
        run: |
          python3 scripts/widget-einrichten.py
          echo "--- AndroidManifest.xml ---"
          cat android/app/src/main/AndroidManifest.xml

      - name: App-Icon erzeugen (falls vorhanden)
        run: |
          if [ -f resources/icon.png ]; then
            echo "resources/icon.png gefunden - erzeuge Android-Symbole"
            npx @capacitor/assets generate --android --assetPath resources
          else
            echo "Kein resources/icon.png vorhanden - Standardsymbol wird verwendet"
          fi

      - name: Versionsnummer setzen
        run: |
          GRADLE=android/app/build.gradle
          VNAME=$(node -p "require('./package.json').version")
          VCODE=${GITHUB_RUN_NUMBER:-1}
          echo "versionCode $VCODE / versionName $VNAME"
          sed -i "s/versionCode .*/versionCode $VCODE/" "$GRADLE"
          sed -i "s/versionName .*/versionName \"$VNAME\"/" "$GRADLE"
          grep -E "versionCode|versionName" "$GRADLE"

      - name: Web-Dateien uebernehmen
        run: npx cap sync android

      - name: Gradle ausfuehrbar machen
        run: chmod +x android/gradlew

      - name: APK bauen
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Signatur und Version der APK pruefen
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          echo "=============================================="
          echo " SIGNATUR DER FERTIGEN APK"
          echo "=============================================="
          keytool -printcert -jarfile "$APK" | grep -E "SHA256:|Owner:|Inhaber:" | head -3
          echo "----------------------------------------------"
          echo " Erwartet wird dieser Fingerabdruck:"
          keytool -list -v -keystore keystore/debug.keystore -storepass android \
            | grep -E "SHA256:" | head -1
          echo "=============================================="

          # Beide Fingerabdruecke vergleichen und bei Abweichung abbrechen
          IST=$(keytool -printcert -jarfile "$APK" | grep -E "SHA256:" | head -1 | tr -d ' ')
          SOLL=$(keytool -list -v -keystore keystore/debug.keystore -storepass android \
            | grep -E "SHA256:" | head -1 | tr -d ' ')
          if [ "$IST" != "$SOLL" ]; then
            echo "FEHLER: Die APK ist nicht mit dem Projektschluessel signiert."
            echo "  in der APK: $IST"
            echo "  erwartet:   $SOLL"
            exit 1
          fi
          echo "Signatur stimmt mit dem Projektschluessel ueberein."

          echo ""
          echo " VERSION DER APK"
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Dienst-Cockpit-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: GitHub-Release veroeffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          APK=android/app/build/outputs/apk/debug/app-debug.apk

          # Falls dieselbe Version erneut gebaut wird: vorhandenes Release ersetzen
          gh release delete "$TAG" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" 2>/dev/null || true

          gh release create "$TAG" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Soldaten Dashboard $VERSION" \
            --notes "Build vom $(date +%d.%m.%Y). Aenderungen siehe Aenderungsprotokoll im Menue der App."

          echo "Release $TAG veroeffentlicht. Die App findet Updates automatisch,"
          echo "sobald im Menue unter 'Updates' dieses Repository eingetragen ist:"
          echo "  $GITHUB_REPOSITORY"
