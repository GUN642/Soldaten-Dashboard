name: APK bauen

"on":
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Projekt auschecken
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Abhaengigkeiten installieren
        run: npm install

      - name: Android-Projekt erzeugen
        run: npx cap add android

      - name: Kalenderberechtigungen eintragen
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if [ ! -f "$MANIFEST" ]; then
            echo "FEHLER: $MANIFEST nicht gefunden."
            exit 1
          fi
          for P in READ_CALENDAR WRITE_CALENDAR POST_NOTIFICATIONS SCHEDULE_EXACT_ALARM USE_EXACT_ALARM RECEIVE_BOOT_COMPLETED VIBRATE; do
            if grep -q "android.permission.$P" "$MANIFEST"; then
              echo "bereits vorhanden: $P"
            else
              sed -i "s#</manifest>#    <uses-permission android:name=\"android.permission.$P\" />\n</manifest>#" "$MANIFEST"
              echo "eingetragen: $P"
            fi
          done
          echo "--- AndroidManifest.xml ---"
          cat "$MANIFEST"
          for P in READ_CALENDAR WRITE_CALENDAR POST_NOTIFICATIONS; do
            grep -q "android.permission.$P" "$MANIFEST" || { echo "FEHLER: $P fehlt"; exit 1; }
          done

      - name: App-Icon erzeugen (falls vorhanden)
        run: |
          if [ -f resources/icon.png ]; then
            echo "resources/icon.png gefunden - erzeuge Android-Symbole"
            npx @capacitor/assets generate --android --assetPath resources
          else
            echo "Kein resources/icon.png vorhanden - Standardsymbol wird verwendet"
          fi

      - name: Web-Dateien uebernehmen
        run: npx cap sync android

      - name: Gradle ausfuehrbar machen
        run: chmod +x android/gradlew

      - name: APK bauen
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Dienst-Cockpit-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
