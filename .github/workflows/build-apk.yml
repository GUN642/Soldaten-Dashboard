name: APK bauen

# Läuft bei jedem Push auf main und lässt sich zusätzlich von Hand starten
# (Reiter "Actions" -> "APK bauen" -> "Run workflow").
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Projekt auschecken
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Abhängigkeiten installieren
        run: npm install

      - name: Android-Projekt erzeugen
        run: npx cap add android

      - name: Kalenderberechtigungen eintragen
        run: node scripts/berechtigungen.js

      - name: Web-Dateien übernehmen
        run: npx cap sync android

      - name: Gradle ausführbar machen
        run: chmod +x android/gradlew

      - name: APK bauen
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Dienst-Cockpit-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
